name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run build:render
      - run: npm test
      - name: Run integrated ecosystem smoke batch
        run: node dist/tools/ecosystem-batch.js --days 30 --seeds 0:10 --sample 5 --format json > ecosystem-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-smoke
          path: ecosystem-smoke.json
      - run: npm run headless -- --days 365 --dt 60

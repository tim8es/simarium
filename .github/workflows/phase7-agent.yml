name: Phase 7 Agent Diagnostics
# rerun after ecology fixes
# final verification
# validated regression head
# final calibrated verification

on:
  push:
    branches:
      - agent/phase7-ecology

permissions:
  contents: read

concurrency:
  group: phase7-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Integrated 30d smoke
        run: node dist/tools/ecosystem-batch.js --days 30 --seeds 0:10 --sample 5 --format json > ecosystem-smoke.json
      - name: Kernel 365d headless
        run: node dist/tools/headless.js --days 365 --dt 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-regression-smoke
          path: ecosystem-smoke.json
          if-no-files-found: ignore

  diagnostics-short:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: calibration-30d
            days: 30
            seeds: "0:3"
          - label: validation-30d
            days: 30
            seeds: "100:3"
          - label: calibration-60d
            days: 60
            seeds: "0:3"
          - label: validation-60d
            days: 60
            seeds: "100:3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run batch
        shell: bash
        run: |
          /usr/bin/time -v node dist/tools/ecosystem-batch.js             --days ${{ matrix.days }}             --seeds "${{ matrix.seeds }}"             --sample 5             --format json             > "${{ matrix.label }}.json"             2> "${{ matrix.label }}.time.txt"
          cat "${{ matrix.label }}.json"
          cat "${{ matrix.label }}.time.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-${{ matrix.label }}
          path: |
            ${{ matrix.label }}.json
            ${{ matrix.label }}.time.txt

  diagnostics-180:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - label: calibration-180d-0
            seed: 0
          - label: calibration-180d-1
            seed: 1
          - label: calibration-180d-2
            seed: 2
          - label: calibration-180d-3
            seed: 3
          - label: calibration-180d-4
            seed: 4
          - label: calibration-180d-5
            seed: 5
          - label: calibration-180d-6
            seed: 6
          - label: calibration-180d-7
            seed: 7
          - label: calibration-180d-8
            seed: 8
          - label: calibration-180d-9
            seed: 9
          - label: validation-180d-100
            seed: 100
          - label: validation-180d-101
            seed: 101
          - label: validation-180d-102
            seed: 102
          - label: validation-180d-103
            seed: 103
          - label: validation-180d-104
            seed: 104
          - label: validation-180d-105
            seed: 105
          - label: validation-180d-106
            seed: 106
          - label: validation-180d-107
            seed: 107
          - label: validation-180d-108
            seed: 108
          - label: validation-180d-109
            seed: 109
          - label: validation-180d-110
            seed: 110
          - label: validation-180d-111
            seed: 111
          - label: validation-180d-112
            seed: 112
          - label: validation-180d-113
            seed: 113
          - label: validation-180d-114
            seed: 114
          - label: validation-180d-115
            seed: 115
          - label: validation-180d-116
            seed: 116
          - label: validation-180d-117
            seed: 117
          - label: validation-180d-118
            seed: 118
          - label: validation-180d-119
            seed: 119
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run one independent 180d seed
        shell: bash
        run: |
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days 180 \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json \
            > "${{ matrix.label }}.json" \
            2> "${{ matrix.label }}.time.txt"
          cat "${{ matrix.label }}.json"
          cat "${{ matrix.label }}.time.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-${{ matrix.label }}
          path: |
            ${{ matrix.label }}.json
            ${{ matrix.label }}.time.txt
          if-no-files-found: ignore

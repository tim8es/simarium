name: Phase 7 Calibration Checkpoints

on:
  push:
    branches:
      - agent/phase7-ecology
    paths:
      - ".github/workflows/phase7-calibration.yml"

permissions:
  contents: read

jobs:
  checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        seed: [0, 1, 2]
        days: [90, 120, 150]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run calibration checkpoint
        shell: bash
        run: |
          label="calibration-${{ matrix.days }}d-${{ matrix.seed }}"
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days ${{ matrix.days }} \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json \
            > "$label.json" \
            2> "$label.time.txt"
          cat "$label.json"
          cat "$label.time.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-calibration-${{ matrix.days }}d-${{ matrix.seed }}
          path: |
            calibration-${{ matrix.days }}d-${{ matrix.seed }}.json
            calibration-${{ matrix.days }}d-${{ matrix.seed }}.time.txt
          if-no-files-found: ignore

name: Phase 7 Dalotia Calibration Verification
# 180-day local predator establishment verification

on:
  push:
    branches:
      - agent/phase7-ecology
    paths:
      - ".github/workflows/phase7-dalotia-check.yml"
      - "packages/sim-core/src/phase6.ts"
      - "data/experiments/phase6-dalotia.json"
      - "data/experiments/phase7-integrated.json"
      - "tools/ecosystem-factory.ts"

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [0, 1, 2, 3, 4]
        days: [180]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Dalotia persistence checkpoint
        shell: bash
        run: |
          label="dalotia-cal-${{ matrix.days }}d-${{ matrix.seed }}"
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days ${{ matrix.days }} \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json > "$label.json" 2> "$label.time.txt"
          cat "$label.json"
          cat "$label.time.txt"

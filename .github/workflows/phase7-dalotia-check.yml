name: Phase 7 Dalotia Calibration Verification
# focused 180-day checkpoint for the selected spatial competition model

on:
  push:
    branches:
      - agent/phase7-ecology
    paths:
      - ".github/workflows/phase7-dalotia-check.yml"

permissions:
  contents: read

concurrency:
  group: phase7-dalotia-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run selected 180-day calibration seed
        shell: bash
        run: |
          label="dalotia-competition-180d-${{ matrix.seed }}"
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days 180 \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json > "$label.json" 2> "$label.time.txt"
          cat "$label.json"
          cat "$label.time.txt"

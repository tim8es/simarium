name: Phase 7 Dalotia Half-Saturation Sweep

on:
  push:
    branches:
      - agent/phase7-ecology
    paths:
      - ".github/workflows/phase7-dalotia-half-sat-sweep.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        halfSat: [30, 50, 80]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply calibration candidate
        env:
          HALF_SAT: ${{ matrix.halfSat }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const phase6Path = "data/experiments/phase6-dalotia.json";
          const phase6 = JSON.parse(fs.readFileSync(phase6Path, "utf8"));
          phase6.parameters.preyHalfSaturationCount.value = Number(process.env.HALF_SAT);
          fs.writeFileSync(phase6Path, JSON.stringify(phase6, null, 2) + "\n");

          const integratedPath = "data/experiments/phase7-integrated.json";
          const integrated = JSON.parse(fs.readFileSync(integratedPath, "utf8"));
          integrated.spatial.dalotiaPreyEncounterRadiusCells = 2;
          fs.writeFileSync(integratedPath, JSON.stringify(integrated, null, 2) + "\n");
          NODE
      - run: npm run build
      - name: Run 150-day calibration seed
        shell: bash
        run: |
          label="dalotia-half-sat-${{ matrix.halfSat }}-seed-${{ matrix.seed }}"
          set +e
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days 150 \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json > "$label.json" 2> "$label.time.txt"
          code=$?
          cat "$label.json"
          cat "$label.time.txt"
          exit "$code"

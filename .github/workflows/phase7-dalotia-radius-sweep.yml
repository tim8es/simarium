name: Phase 7 Dalotia Prey Radius Sweep

on:
  push:
    branches:
      - agent/phase7-ecology
    paths:
      - ".github/workflows/phase7-dalotia-radius-sweep.yml"
      - "packages/sim-core/src/phase5.ts"
      - "packages/sim-core/src/phase6.ts"
      - "data/experiments/phase7-integrated.json"
      - "tools/ecosystem-factory.ts"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        radius: [1, 2]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply calibration candidate
        env:
          RADIUS: ${{ matrix.radius }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const path = "data/experiments/phase7-integrated.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          data.spatial.dalotiaPreyEncounterRadiusCells = Number(process.env.RADIUS);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          NODE
      - run: npm run build
      - name: Run 150-day calibration seed
        shell: bash
        run: |
          label="dalotia-radius-${{ matrix.radius }}-seed-${{ matrix.seed }}"
          set +e
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days 150 \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json > "$label.json" 2> "$label.time.txt"
          code=$?
          cat "$label.json"
          cat "$label.time.txt"
          exit "$code"

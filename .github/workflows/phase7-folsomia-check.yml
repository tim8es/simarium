name: Phase 7 Folsomia Calibration Verification
# lifespan evidence rerun

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase7-folsomia-check.yml"
      - "data/experiments/phase3-folsomia.json"
      - "packages/sim-core/src/phase3.ts"
      - "tools/ecosystem-factory.ts"
      - "data/experiments/phase7-integrated.json"

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [0, 1, 2]
        days: [120, 150]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:core
      - name: Run calibrated checkpoint
        shell: bash
        run: |
          label="folsomia-cal-${{ matrix.days }}d-${{ matrix.seed }}"
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days ${{ matrix.days }} \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json > "$label.json" 2> "$label.time.txt"
          cat "$label.json"
          cat "$label.time.txt"
          node --input-type=module - "$label.json" <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (report.invariantFailureRuns !== 0) {
            throw new Error(`Folsomia checkpoint invariant failures: ${report.invariantFailureRuns}`);
          }
          if ((report.persistenceProbability?.folsomia ?? 0) < 1) {
            throw new Error("Folsomia did not persist in this calibration checkpoint");
          }
          if ((report.postStartGenerationProbability?.folsomia ?? 0) < 1) {
            throw new Error("Folsomia produced no post-start generation in this checkpoint");
          }
          NODE

name: Phase 7 Folsomia Reserve Sweep

on:
  push:
    branches:
      - agent/phase7-ecology
    paths:
      - ".github/workflows/phase7-folsomia-sweep.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        reserve: [0.223, 0.225, 0.227]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply calibration candidate
        env:
          RESERVE: ${{ matrix.reserve }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const path = "data/experiments/phase3-folsomia.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          data.parameters.reproductionReserveFraction.value = Number(process.env.RESERVE);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          NODE
      - run: npm run build
      - name: Run 150-day calibration seed
        shell: bash
        run: |
          label="folsomia-reserve-${{ matrix.reserve }}-seed-${{ matrix.seed }}"
          /usr/bin/time -v node dist/tools/ecosystem-batch.js \
            --days 150 \
            --seeds "${{ matrix.seed }}:1" \
            --sample 10 \
            --format json > "$label.json" 2> "$label.time.txt"
          cat "$label.json"
          cat "$label.time.txt"

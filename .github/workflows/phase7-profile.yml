name: Phase 7 Agent Profile

on:
  push:
    branches:
      - agent/phase7-ecology

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Profile 35 virtual days by system
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { performance } from "node:perf_hooks";
          import { createIntegratedEcosystem } from "./dist/tools/ecosystem-factory.js";
          const eco = createIntegratedEcosystem(0);
          const dt = eco.world.config.fixedDtSeconds;
          const stepsPerDay = 86400 / dt;
          const ms = Object.fromEntries(eco.scheduler.systems.map(s => [s.name, 0]));
          for (let day = 1; day <= 35; day++) {
            for (let step = 0; step < stepsPerDay; step++) {
              for (const system of eco.scheduler.systems) {
                const start = performance.now();
                system.step(eco.world, dt);
                ms[system.name] += performance.now() - start;
              }
              eco.world.timeSeconds += dt;
              eco.world.tick += 1;
            }
            eco.invariants.check(eco.world);
            if (day % 5 === 0 || day === 1) {
              console.log(JSON.stringify({
                day,
                living: {
                  folsomia: eco.animals.folsomia.living().length,
                  trichorhina: eco.animals.trichorhina.living().length,
                  bradysia: eco.animals.bradysia.living().length,
                  dalotia: eco.animals.dalotia.living().length
                }
              }));
            }
          }
          console.log("SYSTEM_PROFILE");
          console.log(JSON.stringify(Object.entries(ms).sort((a,b)=>b[1]-a[1]), null, 2));
          NODE

name: Rendering Benchmark

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/render-core/**"
      - "tests/render-adapter.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-benchmark.yml"
      - "docs/RENDERING.md"
      - "docs/RENDER_BENCHMARK.md"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/render-core/**"
      - "tests/render-adapter.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: render-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vitest run tests/render-adapter.test.ts
      - run: npm run build
      - run: npm run build:render
